# perq POC — local PostGIS only. Throwaway; synthetic data only.
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: perq-poc-db
    environment:
      POSTGRES_USER: perq
      POSTGRES_PASSWORD: perq
      POSTGRES_DB: perq_poc
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perq -d perq_poc"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - perq_poc_pgdata:/var/lib/postgresql/data

volumes:
  perq_poc_pgdata:
